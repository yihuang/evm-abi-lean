name: Perf

# Two jobs, because neither answers "did this commit move the encoder" alone.
#
# `refcount` counts `lean_inc`/`lean_dec` in the generated C.  Lean's ownership
# inference reacts to the shape of the types a function scrutinises, not only
# to its own source, so a `Ty` change can add a `lean_dec` to a per-element
# walker with the body untouched.  Exact and cheap,
# but it counts occurrences rather than executions, so it reports.
#
# `bench` measures `BenchRegress.lean`, one row per `encodeFast` arm, against
# the merge base.  Instruction counts under callgrind are deterministic, so
# they carry the threshold and this is the job that fails; wall clock runs
# alongside because instructions are not time, and is advisory.
#
# Both rows and scripts live here.  They used to come from the cross-language
# harness, whose rows cover neither `address` nor several encoder arms, so a
# regression in one of them was invisible.
#
# A verdict never blocks the merge; a check that cannot run does.  Swallowing
# both looks the same from the outside -- green -- and a perf check nobody can
# distinguish from a broken one is worth nothing.

on:
  pull_request:
  workflow_dispatch:

jobs:
  refcount:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Builds this revision and installs the toolchain the base build reuses.
      - uses: leanprover/lean-action@v1
        with:
          build-args: EvmAbi

      - name: Compare against the merge base
        run: |
          base=$(git merge-base "origin/${{ github.base_ref || 'main' }}" HEAD)
          echo "merge base: $base"
          ./scripts/rc_counts.py .lake/build/ir > /tmp/after.json
          git worktree add /tmp/base "$base"
          (cd /tmp/base && lake build EvmAbi)
          ./scripts/rc_counts.py /tmp/base/.lake/build/ir > /tmp/before.json
          # `--diff` exits non-zero when it finds increases.  That is a
          # verdict, not a breakage, so it must not fail the job -- but the
          # snapshots and builds above still can.
          ./scripts/rc_counts.py --diff /tmp/before.json /tmp/after.json \
            | tee /tmp/rc.txt || true

      - name: Summary
        if: always()
        run: |
          {
            echo '## Reference-count traffic vs the merge base'
            echo
            echo 'Counted per occurrence, not per call: an increase inside a'
            echo 'per-element walker (`emitVal`, `emitVals`, `emitAny`) is paid'
            echo 'per element and is worth chasing, where the same increase in'
            echo 'something run once per encode is usually the price of a win.'
            echo
            echo '```'
            cat /tmp/rc.txt 2>/dev/null || echo '(did not run)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  bench:
    runs-on: ubuntu-latest
    env:
      # `cg_counts.py` also requires an absolute rise, since startup does not
      # cancel exactly between builds.  A real regression on these rows runs
      # to three and four figures.
      THRESHOLD: "0.02"
      ACK: ${{ contains(github.event.pull_request.labels.*.name, 'perf-ack') }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: leanprover/lean-action@v1
        with:
          build-args: EvmAbi

      - run: sudo apt-get update -qq && sudo apt-get install -y -qq valgrind

      # The base builds this revision's bench, not its own: a merge base older
      # than a row does not have it, and a pull request free to change both
      # could otherwise report a change in the instrument as one in the code.
      - name: Build both benches
        id: build
        run: |
          base=$(git merge-base "origin/${{ github.base_ref || 'main' }}" HEAD)
          echo "merge base: $base"
          ./scripts/bench_ab.py --build "$PWD" /tmp/head
          git worktree add /tmp/base "$base"
          ./scripts/bench_ab.py --build /tmp/base /tmp/baseline --bench-from "$PWD" ||
            { echo "base=failed" >> "$GITHUB_OUTPUT"
              echo "::warning::the merge base does not build this revision's bench"; }

      - name: Instructions per row
        id: cg
        if: steps.build.outputs.base != 'failed'
        run: |
          ./scripts/cg_counts.py --snapshot /tmp/baseline /tmp/before.json
          ./scripts/cg_counts.py --snapshot /tmp/head /tmp/after.json
          # Redirect rather than pipe: the default shell has no `pipefail`, so
          # `| tee` would report tee's status and the verdict would read clean.
          if ./scripts/cg_counts.py --diff /tmp/before.json /tmp/after.json \
               --threshold "$THRESHOLD" > /tmp/cg.txt; then
            echo "moved=no" >> "$GITHUB_OUTPUT"
          else
            echo "moved=yes" >> "$GITHUB_OUTPUT"
          fi
          cat /tmp/cg.txt

      # Advisory: instructions are not time, and a row the gate flagged wants
      # an answer in what a caller actually pays.
      - name: Wall clock
        if: always() && steps.build.outputs.base != 'failed'
        run: ./scripts/bench_ab.py /tmp/baseline /tmp/head --runs 15 2>/dev/null
          | tee /tmp/ab.txt || true

      - name: Summary
        if: always()
        run: |
          {
            echo '## Instructions per row vs the merge base'
            echo
            echo '```'
            cat /tmp/cg.txt 2>/dev/null || echo '(did not run)'
            echo '```'
            echo
            echo '## Wall clock vs the merge base'
            echo
            echo 'One row per process, alternating.  Read the verdict, not the'
            echo 'percentage.'
            echo
            echo '```'
            cat /tmp/ab.txt 2>/dev/null || echo '(did not run)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verdict
        if: always()
        run: |
          if [ "$ACK" = true ]; then
            echo "perf-ack is set: a measured rise on this pull request is intended."
            exit 0
          fi
          if [ "${{ steps.build.outputs.base }}" = failed ]; then
            echo "The merge base could not build this revision's bench, so nothing"
            echo "was compared.  Label 'perf-ack' if that gap is intended."
            exit 1
          fi
          if [ "${{ steps.cg.outputs.moved }}" = yes ]; then
            echo "A row gained more than ${THRESHOLD} -- see the job summary."
            echo "Label 'perf-ack' if that is the price of a win elsewhere."
            exit 1
          fi
          echo "No row gained more than ${THRESHOLD}."
