name = "abi-lean"
version = "0.1.0"
defaultTargets = ["EvmAbi"]
testDriver = "Tests"

[[lean_lib]]
name = "EvmAbi"
# `EvmAbi.HumanReadable.Meta` is deliberately not imported by the `EvmAbi` root
# module (it pulls in the Lean frontend), so build the whole tree by glob rather
# than through the root's import surface.
globs = ["EvmAbi", "EvmAbi.+"]

[[lean_lib]]
name = "Tests"

# Not in `defaultTargets`: the encoder benchmark is built on demand with
# `lake build bench`, so CI does not pay for it.
[[lean_exe]]
name = "bench"
root = "Bench"

[[require]]
name = "binary"
git = "https://github.com/yihuang/lean-binary.git"
rev = "push"
